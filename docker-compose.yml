services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt-image-service:latest
    container_name: chatgpt-image-service
    restart: unless-stopped
    ports:
      # 与 Java 的 AI_PROXY_URL 默认值保持一致，避免额外适配服务。
      - "8010:8000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      GEMINI_COOKIE_PATH: /app/data/gemini_webapi
      STORAGE_BACKEND: mysql
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: flexi_admin
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
    extra_hosts:
      - "host.docker.internal:host-gateway"
