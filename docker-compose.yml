services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt-image-service:latest
    container_name: chatgpt-image-service
    restart: unless-stopped
    ports:
      # 默认仅本机浏览器可直连；远程浏览器需配置受防火墙保护的监听地址与 HTTPS 入口。
      - "${AI_PROXY_BIND_HOST:-127.0.0.1}:${AI_PROXY_PORT:-8010}:8000"
    environment:
      GEMINI_REFRESH_INTERVAL: ${GEMINI_REFRESH_INTERVAL:-600}
      # 本地代理必须显式给三个平台与总准入器容量，默认值仅用于开发测试。
      GPT_LIMIT: ${GPT_LIMIT:-100}
      GEMINI_LIMIT: ${GEMINI_LIMIT:-100}
      DOUBAO_LIMIT: ${DOUBAO_LIMIT:-100}
      MODEL_GLOBAL_LIMIT: ${MODEL_GLOBAL_LIMIT:-150}
      GPT_REFRESH_CONCURRENCY: ${GPT_REFRESH_CONCURRENCY:-5}
      STORAGE_BACKEND: mysql
      MYSQL_HOST: ${DB_HOST:-mysql}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_NAME:-flexi_admin}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REMBG_HOME: /root/.rembg
      OSS_ACCESS_ID: ${OSS_ACCESS_ID}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-jyf6}
    networks:
      - scheduler-shared
    volumes:
      - rembg-cache:/root/.rembg
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  scheduler-shared:
    external: true
    name: flexi-scheduler-shared

volumes:
  rembg-cache:
