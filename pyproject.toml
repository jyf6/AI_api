[project]
name = "chatgpt-image-service"
version = "2.0.0"
description = "ChatGPT Image Generation Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "loguru~=0.7.3",
    "orjson~=3.11.9",
    "pybase64>=1.4.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "websockets>=15.0",
    "pillow>=10.0.0",
    "pymysql>=1.1.1",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.4.6",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "rembg>=2.0.84",
    "onnxruntime>=1.29.0",
    "oss2>=2.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
