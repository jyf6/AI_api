[project]
name = "chatgpt-image-service"
version = "2.0.0"
description = "ChatGPT Image Generation Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "fastapi>=0.115.0",
    "gemini-webapi>=2.1.1",
    "pybase64>=1.4.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
